<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HabitForge — Daily Habit Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
/* ============ DESIGN TOKENS ============ */
:root, [data-theme="light"] {
  --color-bg: #f7f6f2;
  --color-surface: #f9f8f5;
  --color-surface-2: #fbfbf9;
  --color-surface-offset: #f3f0ec;
  --color-surface-offset-2: #edeae5;
  --color-surface-dynamic: #e6e4df;
  --color-divider: #dcd9d5;
  --color-border: #d4d1ca;
  --color-text: #28251d;
  --color-text-muted: #7a7974;
  --color-text-faint: #bab9b4;
  --color-text-inverse: #f9f8f4;
  --color-primary: #01696f;
  --color-primary-hover: #0c4e54;
  --color-primary-highlight: #cedcd8;
  --color-success: #437a22;
  --color-success-hover: #2e5c10;
  --color-success-highlight: #d4dfcc;
  --color-warning: #964219;
  --color-error: #a12c7b;
  --color-gold: #d19900;
  --shadow-sm: 0 1px 2px oklch(0.2 0.01 80 / 0.06);
  --shadow-md: 0 4px 12px oklch(0.2 0.01 80 / 0.08);
  --shadow-lg: 0 12px 32px oklch(0.2 0.01 80 / 0.12);
  --radius-sm: 0.375rem;
  --radius-md: 0.5rem;
  --radius-lg: 0.75rem;
  --radius-xl: 1rem;
  --radius-full: 9999px;
  --text-xs: clamp(0.75rem, 0.7rem + 0.25vw, 0.875rem);
  --text-sm: clamp(0.875rem, 0.8rem + 0.35vw, 1rem);
  --text-base: clamp(1rem, 0.95rem + 0.25vw, 1.125rem);
  --text-lg: clamp(1.125rem, 1rem + 0.75vw, 1.5rem);
  --text-xl: clamp(1.5rem, 1.2rem + 1.25vw, 2.25rem);
  --space-1: 0.25rem; --space-2: 0.5rem; --space-3: 0.75rem;
  --space-4: 1rem; --space-5: 1.25rem; --space-6: 1.5rem;
  --space-8: 2rem; --space-10: 2.5rem; --space-12: 3rem;
  --space-16: 4rem; --space-20: 5rem;
  --transition-interactive: 180ms cubic-bezier(0.16, 1, 0.3, 1);
  --font-body: 'Inter', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
}

[data-theme="dark"] {
  --color-bg: #0f0f0d;
  --color-surface: #141412;
  --color-surface-2: #1a1917;
  --color-surface-offset: #1e1d1b;
  --color-surface-offset-2: #232220;
  --color-surface-dynamic: #2a2926;
  --color-divider: #262523;
  --color-border: #333230;
  --color-text: #e8e6e2;
  --color-text-muted: #8a8882;
  --color-text-faint: #5a5957;
  --color-text-inverse: #1c1b19;
  --color-primary: #4f98a3;
  --color-primary-hover: #6ab8c4;
  --color-primary-highlight: #1e3535;
  --color-success: #6daa45;
  --color-success-hover: #4d8f25;
  --color-success-highlight: #1e3020;
  --color-warning: #bb653b;
  --color-error: #d163a7;
  --color-gold: #e8af34;
  --shadow-sm: 0 1px 2px oklch(0 0 0 / 0.25);
  --shadow-md: 0 4px 12px oklch(0 0 0 / 0.35);
  --shadow-lg: 0 12px 32px oklch(0 0 0 / 0.45);
}

/* ============ BASE ============ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; scroll-behavior: smooth; }
body {
  min-height: 100dvh;
  font-family: var(--font-body);
  font-size: var(--text-sm);
  color: var(--color-text);
  background-color: var(--color-bg);
  transition: background-color 300ms ease, color 300ms ease;
}
button { cursor: pointer; background: none; border: none; font: inherit; color: inherit; }
input, textarea, select { font: inherit; color: inherit; }
a { color: inherit; text-decoration: none; }
ul, ol { list-style: none; }
img { display: block; max-width: 100%; }
::selection { background: oklch(from var(--color-primary) l c h / 0.25); color: var(--color-text); }
:focus-visible { outline: 2px solid var(--color-primary); outline-offset: 3px; border-radius: var(--radius-sm); }
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: var(--color-bg); }
::-webkit-scrollbar-thumb { background: var(--color-border); border-radius: var(--radius-full); }
::-webkit-scrollbar-thumb:hover { background: var(--color-text-muted); }

/* ============ LAYOUT ============ */
.app-wrapper { display: flex; min-height: 100dvh; }

/* ============ SIDEBAR ============ */
.sidebar {
  width: 240px; min-height: 100dvh;
  background: var(--color-surface);
  border-right: 1px solid var(--color-border);
  display: flex; flex-direction: column;
  position: fixed; left: 0; top: 0; bottom: 0;
  z-index: 100;
  transition: transform var(--transition-interactive), width var(--transition-interactive);
  overflow: hidden;
}
.sidebar-logo {
  padding: var(--space-5) var(--space-5) var(--space-4);
  display: flex; align-items: center; gap: var(--space-3);
  border-bottom: 1px solid var(--color-divider);
}
.logo-icon {
  width: 32px; height: 32px; flex-shrink: 0;
}
.logo-text {
  font-size: var(--text-base);
  font-weight: 700;
  color: var(--color-text);
  letter-spacing: -0.02em;
}
.logo-text span { color: var(--color-primary); }

.sidebar-nav { flex: 1; padding: var(--space-3) var(--space-2); overflow-y: auto; }
.nav-section-label {
  font-size: var(--text-xs);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--color-text-faint);
  padding: var(--space-3) var(--space-3) var(--space-2);
}
.nav-item {
  display: flex; align-items: center; gap: var(--space-3);
  padding: var(--space-2) var(--space-3);
  border-radius: var(--radius-md);
  color: var(--color-text-muted);
  font-size: var(--text-sm);
  font-weight: 500;
  cursor: pointer;
  transition: all var(--transition-interactive);
  margin-bottom: 2px;
  border: none; background: none; width: 100%; text-align: left;
}
.nav-item:hover { background: var(--color-surface-offset); color: var(--color-text); }
.nav-item.active { background: var(--color-primary-highlight); color: var(--color-primary); }
.nav-item svg { flex-shrink: 0; }

.sidebar-footer {
  padding: var(--space-4);
  border-top: 1px solid var(--color-divider);
  display: flex; align-items: center; justify-content: space-between;
}
.theme-toggle {
  width: 36px; height: 36px;
  display: flex; align-items: center; justify-content: center;
  border-radius: var(--radius-md);
  color: var(--color-text-muted);
  transition: all var(--transition-interactive);
}
.theme-toggle:hover { background: var(--color-surface-offset); color: var(--color-text); }

/* ============ MAIN ============ */
.main-content {
  margin-left: 240px;
  flex: 1;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
}

.topbar {
  height: 56px;
  background: var(--color-surface);
  border-bottom: 1px solid var(--color-border);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 var(--space-8);
  position: sticky; top: 0; z-index: 50;
}
.topbar-left { display: flex; align-items: center; gap: var(--space-4); }
.topbar-title { font-size: var(--text-lg); font-weight: 700; letter-spacing: -0.02em; }
.month-nav { display: flex; align-items: center; gap: var(--space-2); }
.month-nav-btn {
  width: 28px; height: 28px;
  display: flex; align-items: center; justify-content: center;
  border-radius: var(--radius-sm);
  color: var(--color-text-muted);
  transition: all var(--transition-interactive);
}
.month-nav-btn:hover { background: var(--color-surface-offset); color: var(--color-text); }
.month-label { font-weight: 600; font-size: var(--text-sm); min-width: 120px; text-align: center; }
.topbar-right { display: flex; align-items: center; gap: var(--space-3); }
.btn {
  display: inline-flex; align-items: center; gap: var(--space-2);
  padding: var(--space-2) var(--space-4);
  border-radius: var(--radius-md);
  font-size: var(--text-sm);
  font-weight: 500;
  transition: all var(--transition-interactive);
  cursor: pointer;
  border: none;
}
.btn-primary {
  background: var(--color-primary);
  color: white;
}
.btn-primary:hover { background: var(--color-primary-hover); }
.btn-ghost {
  background: transparent;
  color: var(--color-text-muted);
  border: 1px solid var(--color-border);
}
.btn-ghost:hover { background: var(--color-surface-offset); color: var(--color-text); }

/* ============ PAGE CONTENT ============ */
.page { display: none; flex: 1; flex-direction: column; }
.page.active { display: flex; }
.page-inner { padding: var(--space-6) var(--space-8); flex: 1; overflow-y: auto; }

/* ============ STATS ROW ============ */
.stats-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: var(--space-4);
  margin-bottom: var(--space-6);
}
.stat-card {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  padding: var(--space-4) var(--space-5);
  box-shadow: var(--shadow-sm);
}
.stat-label { font-size: var(--text-xs); color: var(--color-text-muted); font-weight: 500; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: var(--space-1); }
.stat-value { font-size: var(--text-xl); font-weight: 700; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; color: var(--color-text); }
.stat-sub { font-size: var(--text-xs); color: var(--color-text-muted); margin-top: var(--space-1); }
.stat-value.primary { color: var(--color-primary); }
.stat-value.success { color: var(--color-success); }
.stat-value.gold { color: var(--color-gold); }

/* Progress bar */
.progress-bar-wrap { margin-top: var(--space-2); height: 6px; background: var(--color-surface-offset); border-radius: var(--radius-full); overflow: hidden; }
.progress-bar-fill { height: 100%; border-radius: var(--radius-full); background: var(--color-primary); transition: width 600ms cubic-bezier(0.16, 1, 0.3, 1); }

/* ============ CHART SECTION ============ */
.chart-card {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  padding: var(--space-5);
  margin-bottom: var(--space-6);
  box-shadow: var(--shadow-sm);
}
.chart-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--space-4); }
.chart-title { font-size: var(--text-base); font-weight: 600; }
.chart-sub { font-size: var(--text-xs); color: var(--color-text-muted); margin-top: 2px; }
.chart-wrap { height: 180px; position: relative; }

/* ============ TRACKER TABLE ============ */
.tracker-section {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  overflow: hidden;
  box-shadow: var(--shadow-sm);
  margin-bottom: var(--space-6);
}
.tracker-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: var(--space-4) var(--space-5);
  border-bottom: 1px solid var(--color-divider);
}
.tracker-title { font-size: var(--text-base); font-weight: 600; }
.tracker-scroll { overflow-x: auto; }
.tracker-table {
  width: 100%;
  border-collapse: collapse;
  min-width: 900px;
  table-layout: fixed;
}
.tracker-table thead th {
  padding: var(--space-2) var(--space-2);
  text-align: center;
  font-size: var(--text-xs);
  font-weight: 600;
  color: var(--color-text-muted);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  border-bottom: 1px solid var(--color-divider);
  white-space: nowrap;
}
.tracker-table thead th.habit-col { text-align: left; padding-left: var(--space-5); width: 180px; }
.tracker-table th.week-group { background: var(--color-surface-offset); color: var(--color-text-muted); font-size: var(--text-xs); }
.tracker-table th.day-num { width: 36px; }
.tracker-table th.today-col { color: var(--color-primary) !important; }
.tracker-table tbody tr { border-bottom: 1px solid oklch(from var(--color-divider) l c h / 0.6); }
.tracker-table tbody tr:last-child { border-bottom: none; }
.tracker-table tbody tr:hover td { background: var(--color-surface-offset); }
.tracker-table td {
  padding: var(--space-2);
  text-align: center;
  transition: background var(--transition-interactive);
}
.tracker-table td.habit-name {
  text-align: left;
  padding-left: var(--space-5);
  font-size: var(--text-sm);
  font-weight: 500;
  color: var(--color-text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.tracker-table td.habit-name .habit-emoji { margin-right: var(--space-2); }

/* Checkbox cells */
.check-cell { position: relative; }
.check-cell .cb {
  width: 22px; height: 22px;
  border: 1.5px solid var(--color-border);
  border-radius: var(--radius-sm);
  background: var(--color-surface-2);
  display: inline-flex; align-items: center; justify-content: center;
  cursor: pointer;
  transition: all var(--transition-interactive);
  position: relative;
}
.check-cell .cb:hover { border-color: var(--color-primary); background: var(--color-primary-highlight); }
.check-cell .cb.checked {
  background: var(--color-primary);
  border-color: var(--color-primary);
}
.check-cell .cb.checked svg { opacity: 1; }
.check-cell .cb svg { opacity: 0; transition: opacity 150ms ease; }
.check-cell .cb.future { opacity: 0.35; cursor: not-allowed; pointer-events: none; }
.check-cell td.today-col { background: oklch(from var(--color-primary) l c h / 0.04); }

/* Footer rows */
.tracker-table .progress-row td {
  background: var(--color-surface-offset);
  font-size: var(--text-xs);
  font-weight: 700;
  font-family: var(--font-mono);
  color: var(--color-text-muted);
  border-top: 1px solid var(--color-divider);
  padding: var(--space-2);
}
.tracker-table .progress-row td.habit-name { color: var(--color-text-faint); font-weight: 600; font-size: var(--text-xs); font-family: var(--font-body); }
.tracker-table .count-row td {
  font-size: var(--text-xs);
  font-family: var(--font-mono);
  color: var(--color-text-muted);
  font-weight: 500;
  background: var(--color-surface-offset-2);
}
.tracker-table .count-row td.habit-name { font-family: var(--font-body); color: var(--color-text-faint); font-size: var(--text-xs); }

.progress-pct { font-variant-numeric: tabular-nums; }
.pct-high { color: var(--color-success); }
.pct-mid { color: var(--color-gold); }
.pct-low { color: var(--color-error); }

/* ============ TODAY HIGHLIGHT ============ */
.today-badge {
  display: inline-flex; align-items: center;
  padding: 2px var(--space-2);
  background: var(--color-primary);
  color: white;
  border-radius: var(--radius-full);
  font-size: var(--text-xs);
  font-weight: 600;
}

/* ============ HABIT MANAGEMENT PAGE ============ */
.habits-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-6); align-items: start; }
@media (max-width: 900px) { .habits-grid { grid-template-columns: 1fr; } }

.habit-list-card, .add-habit-card {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  overflow: hidden;
  box-shadow: var(--shadow-sm);
}
.card-header {
  padding: var(--space-4) var(--space-5);
  border-bottom: 1px solid var(--color-divider);
  display: flex; align-items: center; justify-content: space-between;
}
.card-title { font-size: var(--text-base); font-weight: 600; }
.card-body { padding: var(--space-5); }

.habit-list-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: var(--space-3) var(--space-4);
  border-radius: var(--radius-md);
  transition: background var(--transition-interactive);
  margin-bottom: var(--space-1);
}
.habit-list-item:hover { background: var(--color-surface-offset); }
.habit-list-item .habit-info { display: flex; align-items: center; gap: var(--space-3); flex: 1; }
.habit-list-item .habit-emoji-big { font-size: 1.25rem; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; }
.habit-list-item .habit-name-text { font-size: var(--text-sm); font-weight: 500; }
.habit-list-item .habit-streak { font-size: var(--text-xs); color: var(--color-text-muted); }
.habit-list-item .habit-actions { display: flex; gap: var(--space-1); opacity: 0; transition: opacity var(--transition-interactive); }
.habit-list-item:hover .habit-actions { opacity: 1; }
.icon-btn {
  width: 28px; height: 28px;
  display: flex; align-items: center; justify-content: center;
  border-radius: var(--radius-sm);
  color: var(--color-text-muted);
  transition: all var(--transition-interactive);
}
.icon-btn:hover { background: var(--color-surface-dynamic); color: var(--color-text); }
.icon-btn.danger:hover { background: color-mix(in oklch, var(--color-error) 15%, transparent); color: var(--color-error); }

/* Form */
.form-group { margin-bottom: var(--space-4); }
.form-label { display: block; font-size: var(--text-xs); font-weight: 600; color: var(--color-text-muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: var(--space-2); }
.form-input {
  width: 100%;
  padding: var(--space-3) var(--space-4);
  background: var(--color-surface-offset);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  font-size: var(--text-sm);
  color: var(--color-text);
  transition: all var(--transition-interactive);
}
.form-input:focus { outline: none; border-color: var(--color-primary); box-shadow: 0 0 0 3px oklch(from var(--color-primary) l c h / 0.15); }
.form-input::placeholder { color: var(--color-text-faint); }

.emoji-picker { display: flex; flex-wrap: wrap; gap: var(--space-2); margin-top: var(--space-2); }
.emoji-btn {
  width: 36px; height: 36px;
  display: flex; align-items: center; justify-content: center;
  border-radius: var(--radius-sm);
  font-size: 1.1rem;
  background: var(--color-surface-offset);
  border: 1.5px solid transparent;
  cursor: pointer;
  transition: all var(--transition-interactive);
}
.emoji-btn:hover { border-color: var(--color-primary); background: var(--color-primary-highlight); }
.emoji-btn.selected { border-color: var(--color-primary); background: var(--color-primary-highlight); }

/* ============ STREAK PAGE ============ */
.streaks-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: var(--space-4); }
.streak-card {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  padding: var(--space-5);
  box-shadow: var(--shadow-sm);
  transition: box-shadow var(--transition-interactive), transform var(--transition-interactive);
}
.streak-card:hover { box-shadow: var(--shadow-md); transform: translateY(-1px); }
.streak-emoji { font-size: 1.75rem; margin-bottom: var(--space-3); }
.streak-habit-name { font-size: var(--text-sm); font-weight: 600; color: var(--color-text); margin-bottom: var(--space-1); }
.streak-count { font-size: var(--text-xl); font-weight: 700; color: var(--color-gold); letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.streak-label { font-size: var(--text-xs); color: var(--color-text-muted); margin-top: 2px; }
.streak-dots { display: flex; gap: 3px; margin-top: var(--space-3); flex-wrap: wrap; }
.streak-dot { width: 10px; height: 10px; border-radius: 2px; background: var(--color-surface-dynamic); }
.streak-dot.on { background: var(--color-primary); }
.streak-dot.today { background: var(--color-gold); }

/* ============ HEATMAP ============ */
.heatmap-section {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  padding: var(--space-5);
  box-shadow: var(--shadow-sm);
  margin-bottom: var(--space-6);
  overflow: hidden;
}
.heatmap-title { font-size: var(--text-base); font-weight: 600; margin-bottom: var(--space-4); }
.heatmap-grid { display: flex; gap: 3px; flex-wrap: wrap; }
.hm-cell { width: 14px; height: 14px; border-radius: 2px; background: var(--color-surface-dynamic); transition: opacity 100ms ease; cursor: pointer; }
.hm-cell[data-pct="0"] { background: var(--color-surface-dynamic); }
.hm-cell[data-pct="1"] { background: color-mix(in oklch, var(--color-primary) 30%, var(--color-surface-dynamic)); }
.hm-cell[data-pct="2"] { background: color-mix(in oklch, var(--color-primary) 55%, var(--color-surface-dynamic)); }
.hm-cell[data-pct="3"] { background: color-mix(in oklch, var(--color-primary) 80%, var(--color-surface-dynamic)); }
.hm-cell[data-pct="4"] { background: var(--color-primary); }
.hm-legend { display: flex; align-items: center; gap: var(--space-2); margin-top: var(--space-3); font-size: var(--text-xs); color: var(--color-text-faint); }
.hm-legend-cells { display: flex; gap: 3px; }

/* ============ MODAL ============ */
.modal-overlay {
  position: fixed; inset: 0;
  background: oklch(0 0 0 / 0.5);
  z-index: 200;
  display: flex; align-items: center; justify-content: center;
  padding: var(--space-4);
  opacity: 0; pointer-events: none;
  transition: opacity 200ms ease;
}
.modal-overlay.open { opacity: 1; pointer-events: all; }
.modal {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-xl);
  padding: var(--space-6);
  width: 100%;
  max-width: 420px;
  box-shadow: var(--shadow-lg);
  transform: translateY(12px) scale(0.98);
  transition: transform 220ms cubic-bezier(0.16, 1, 0.3, 1);
}
.modal-overlay.open .modal { transform: translateY(0) scale(1); }
.modal-title { font-size: var(--text-lg); font-weight: 700; margin-bottom: var(--space-5); }
.modal-actions { display: flex; gap: var(--space-3); margin-top: var(--space-5); justify-content: flex-end; }

/* ============ TOAST ============ */
.toast-container { position: fixed; bottom: var(--space-6); right: var(--space-6); z-index: 300; display: flex; flex-direction: column; gap: var(--space-2); pointer-events: none; }
.toast {
  background: var(--color-surface-offset);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  padding: var(--space-3) var(--space-4);
  font-size: var(--text-sm);
  font-weight: 500;
  box-shadow: var(--shadow-md);
  pointer-events: all;
  animation: toastIn 300ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
  display: flex; align-items: center; gap: var(--space-2);
}
@keyframes toastIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
.toast.out { animation: toastOut 200ms ease forwards; }
@keyframes toastOut { to { opacity: 0; transform: translateY(8px); } }
.toast .t-icon { flex-shrink: 0; }

/* ============ EMPTY STATE ============ */
.empty-state { display: flex; flex-direction: column; align-items: center; text-align: center; padding: var(--space-16) var(--space-8); color: var(--color-text-muted); }
.empty-state-icon { width: 52px; height: 52px; margin-bottom: var(--space-4); color: var(--color-text-faint); }
.empty-state h3 { color: var(--color-text); font-size: var(--text-lg); margin-bottom: var(--space-2); }
.empty-state p { max-width: 36ch; margin-bottom: var(--space-6); font-size: var(--text-sm); }

/* ============ SKELETON ============ */
@keyframes shimmer { 0%{background-position:-200% 0} 100%{background-position:200% 0} }
.skeleton {
  background: linear-gradient(90deg, var(--color-surface-offset) 25%, var(--color-surface-dynamic) 50%, var(--color-surface-offset) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.5s ease-in-out infinite;
  border-radius: var(--radius-sm);
}

/* ============ RESPONSIVE ============ */
@media (max-width: 768px) {
  .sidebar { transform: translateX(-100%); }
  .sidebar.open { transform: translateX(0); }
  .main-content { margin-left: 0; }
  .topbar { padding: 0 var(--space-4); }
  .page-inner { padding: var(--space-4); }
  .stats-row { grid-template-columns: repeat(2, 1fr); }
  .hamburger { display: flex; }
}
.hamburger { display: none; width: 36px; height: 36px; align-items: center; justify-content: center; border-radius: var(--radius-md); color: var(--color-text-muted); }
.hamburger:hover { background: var(--color-surface-offset); }
.sidebar-overlay { display: none; position: fixed; inset: 0; background: oklch(0 0 0 / 0.4); z-index: 99; }
@media (max-width: 768px) {
  .sidebar-overlay.open { display: block; }
}

/* Number animation */
@keyframes numUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
.num-animate { animation: numUp 400ms cubic-bezier(0.16, 1, 0.3, 1); }

/* Confetti */
.confetti-container { position: fixed; inset: 0; pointer-events: none; z-index: 400; overflow: hidden; }
.confetti-piece {
  position: absolute;
  width: 8px; height: 8px;
  border-radius: 2px;
  animation: confettiFall 1.5s ease-in forwards;
}
@keyframes confettiFall {
  0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
  100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
}

/* Draghandle */
.drag-handle { cursor: grab; color: var(--color-text-faint); display: flex; align-items: center; }
.drag-handle:active { cursor: grabbing; }
</style>
</head>
<body>

</div>

<div class="main-content">
  <!-- Topbar -->
  <header class="topbar">
    <div class="topbar-left">
      <button class="hamburger" id="hamburger" onclick="openSidebar()" aria-label="Open menu">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <div class="month-nav">
        <button class="month-nav-btn" onclick="prevMonth()" aria-label="Previous month">

        <span class="month-label" id="monthLabel"></span>
        <button class="month-nav-btn" onclick="nextMonth()" aria-label="Next month">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>

    </div>

      <button class="btn btn-ghost" onclick="openAddHabitModal()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Add Habit
      </button>
      <button class="btn btn-primary" onclick="checkToday()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>

      </button>

  </header>

  <!-- TRACKER PAGE -->
  <div class="page active" id="page-tracker">
    <div class="page-inner">
      <!-- Stats -->
      <div class="stats-row" id="statsRow"></div>
      <!-- Chart -->
      <div class="chart-card">
        <div class="chart-header">
          <div>
            <div class="chart-title">Daily Progress</div>
            <div class="chart-sub">Habit completion rate across the month</div>
          </div>
        </div>
        <div class="chart-wrap"><canvas id="progressChart"></canvas></div>
      </div>
      <!-- Tracker Table -->
      <div class="tracker-section">
        <div class="tracker-header">
          <span class="tracker-title" id="trackerTitle"></span>
          <span id="todayBadge"></span>
        </div>
        <div class="tracker-scroll">

  <!-- HABITS MANAGEMENT PAGE -->

              <div class="emoji-picker" id="emojiPicker"></div>
            </div>
            <button class="btn btn-primary" style="width:100%;justify-content:center" onclick="addHabit()">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>

  <!-- STREAKS PAGE -->
  <div class="page" id="page-streaks">

<!-- Add Habit Modal -->
<div class="modal-overlay" id="addHabitModal">

      <button class="btn btn-primary" onclick="addHabitFromModal()">Add Habit</button>
    </div>
  </div>
</div>

<!-- Toast Container -->
<div class="toast-container" id="toastContainer"></div>

<!-- Confetti -->
<div class="confetti-container" id="confettiContainer"></div>

<script>
// ============ STATE ============
const EMOJIS = ['🌅','💪','📚','💰','🎯','🚫','🌿','📓','🚿','🏃','🧘','💊','🥗','💧','✍️','🎨','🎵','🧹','💻','❤️','🧠','🌙','☀️','⚡','🔥'];
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const DAYS = ['Su','Mo','Tu','We','Th','Fr','Sa'];

let today = new Date();
let currentYear = today.getFullYear();
let currentMonth = today.getMonth();
let selectedEmoji = '🎯';
let modalSelectedEmoji = '🎯';

// Load data from memory
let appData = loadData();

function loadData() {
  const defaultHabits = [
    { id: 'h1', name: 'Wake up at 05:00', emoji: '🌅' },
    { id: 'h2', name: 'Gym', emoji: '💪' },
    { id: 'h3', name: 'Reading / Learning', emoji: '📚' },
    { id: 'h4', name: 'Budget Tracking', emoji: '💰' },
    { id: 'h5', name: 'Project Work', emoji: '🎯' },
    { id: 'h6', name: 'No Alcohol', emoji: '🚫' },
    { id: 'h7', name: 'Social Media Detox', emoji: '🌿' },
    { id: 'h8', name: 'Goal Journaling', emoji: '📓' },
    { id: 'h9', name: 'Shower', emoji: '🚿' },
  ];
  // Try sessionStorage (may not work in sandbox, fallback to in-memory)
  try {
    const stored = sessionStorage.getItem('habitforge');
    if (stored) return JSON.parse(stored);
  } catch(e) {}
  return { habits: defaultHabits, checks: {}, nextId: 10 };
}

function saveData() {
  try { sessionStorage.setItem('habitforge', JSON.stringify(appData)); } catch(e) {}
}

// ============ NAVIGATION ============
function showPage(name) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
  document.querySelector('[data-page="' + name + '"]')?.classList.add('active');
  if (name === 'tracker') renderTracker();
  else if (name === 'habits') renderHabitsPage();
  else if (name === 'streaks') renderStreaks();
  else if (name === 'heatmap') renderHeatmap();
  closeSidebar();
}

function openSidebar() {
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('sidebarOverlay').classList.add('open');
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarOverlay').classList.remove('open');
}

// ============ MONTH NAVIGATION ============
function prevMonth() {
  currentMonth--;
  if (currentMonth < 0) { currentMonth = 11; currentYear--; }
  renderTracker();
}
function nextMonth() {
  currentMonth++;
  if (currentMonth > 11) { currentMonth = 0; currentYear++; }
  renderTracker();
}

// ============ CHECK KEY ============
function ck(habitId, year, month, day) {
  return `${habitId}_${year}_${month}_${day}`;
}
function isChecked(habitId, year, month, day) {
  return !!appData.checks[ck(habitId, year, month, day)];
}
function toggleCheck(habitId, year, month, day) {
  const key = ck(habitId, year, month, day);
  const wasChecked = appData.checks[key];
  appData.checks[key] = !wasChecked;
  saveData();
  return !wasChecked;
}

// ============ STATS ============
function getMonthStats(year, month) {
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const habits = appData.habits;
  let totalPossible = 0, totalDone = 0;
  const dayData = [];
  const todayD = today.getDate(), todayM = today.getMonth(), todayY = today.getFullYear();

  for (let d = 1; d <= daysInMonth; d++) {
    const isPast = (year < todayY) || (year === todayY && month < todayM) || (year === todayY && month === todayM && d <= todayD);
    if (!isPast) { dayData.push({ day: d, done: 0, total: habits.length, pct: null }); continue; }
    let done = 0;
    habits.forEach(h => { if (isChecked(h.id, year, month, d)) done++; });
    totalPossible += habits.length;
    totalDone += done;
    dayData.push({ day: d, done, total: habits.length, pct: habits.length ? Math.round(done / habits.length * 100) : 0 });
  }
  const overallPct = totalPossible > 0 ? Math.round(totalDone / totalPossible * 100) : 0;
  return { daysInMonth, habits, totalDone, totalPossible, overallPct, dayData };
}

function getCurrentStreak(habitId) {
  let streak = 0;
  let d = new Date(today);
  while (true) {
    const y = d.getFullYear(), m = d.getMonth(), day = d.getDate();
    if (isChecked(habitId, y, m, day)) { streak++; d.setDate(d.getDate() - 1); }
    else break;
    if (streak > 365) break;
  }
  return streak;
}
function getLongestStreak(habitId) {
  let maxS = 0, curS = 0;
  const start = new Date(today); start.setFullYear(start.getFullYear() - 1);
  let d = new Date(start);
  while (d <= today) {
    if (isChecked(habitId, d.getFullYear(), d.getMonth(), d.getDate())) { curS++; maxS = Math.max(maxS, curS); }
    else curS = 0;
    d.setDate(d.getDate() + 1);
  }
  return maxS;
}

// ============ RENDER STATS ROW ============
function renderStats() {
  const stats = getMonthStats(currentYear, currentMonth);
  const html = `
    <div class="stat-card">
      <div class="stat-label">Total Habits</div>
      <div class="stat-value primary num-animate">${stats.habits.length}</div>
      <div class="stat-sub">Active this month</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Completed</div>
      <div class="stat-value success num-animate">${stats.totalDone}</div>
      <div class="stat-sub">check-ins so far</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Monthly Progress</div>
      <div class="stat-value gold num-animate">${stats.overallPct}%</div>
      <div class="progress-bar-wrap"><div class="progress-bar-fill" style="width:${stats.overallPct}%"></div></div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Best Today</div>
      <div class="stat-value num-animate">${getTodayStats().pct}%</div>
      <div class="stat-sub">${getTodayStats().done}/${stats.habits.length} today</div>
    </div>
  `;
  document.getElementById('statsRow').innerHTML = html;
}

function getTodayStats() {
  const habits = appData.habits;
  let done = 0;
  habits.forEach(h => { if (isChecked(h.id, today.getFullYear(), today.getMonth(), today.getDate())) done++; });
  return { done, pct: habits.length ? Math.round(done / habits.length * 100) : 0 };
}

// ============ RENDER CHART ============
let chartInstance = null;
function renderChart() {
  const stats = getMonthStats(currentYear, currentMonth);
  const labels = stats.dayData.map(d => d.day);
  const data = stats.dayData.map(d => d.pct !== null ? d.pct : null);

  const ctx = document.getElementById('progressChart').getContext('2d');
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  const primary = isDark ? '#4f98a3' : '#01696f';
  const grid = isDark ? 'rgba(255,255,255,0.06)' : 'rgba(0,0,0,0.06)';
  const text = isDark ? '#8a8882' : '#7a7974';

  if (chartInstance) chartInstance.destroy();
  chartInstance = new Chart(ctx, {
    type: 'line',
    data: {
      labels,
      datasets: [{
        data,
        borderColor: primary,
        backgroundColor: primary + '28',
        borderWidth: 2,
        fill: true,
        tension: 0.4,
        pointRadius: 3,
        pointHoverRadius: 5,
        pointBackgroundColor: primary,
        pointBorderColor: 'transparent',
        spanGaps: false,
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false }, tooltip: {
        backgroundColor: isDark ? '#1a1917' : '#f9f8f5',
        borderColor: isDark ? '#333230' : '#d4d1ca',
        borderWidth: 1,
        titleColor: text,
        bodyColor: isDark ? '#e8e6e2' : '#28251d',
        padding: 10,
        callbacks: { label: ctx => `${ctx.parsed.y ?? 0}% completed` }
      }},
      scales: {
        x: { grid: { color: grid, drawBorder: false }, ticks: { color: text, font: { size: 11 }, maxTicksLimit: 15 } },
        y: { min: 0, max: 100, grid: { color: grid, drawBorder: false }, ticks: { color: text, font: { size: 11 }, callback: v => v + '%' } }
      },
      interaction: { intersect: false, mode: 'index' }
    }
  });
}

// ============ RENDER TRACKER TABLE ============
function renderTracker() {
  const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
  const habits = appData.habits;
  const todayD = today.getDate(), todayM = today.getMonth(), todayY = today.getFullYear();
  const isCurrentMonth = currentYear === todayY && currentMonth === todayM;

  // Month label
  document.getElementById('monthLabel').textContent = `${MONTHS[currentMonth]} ${currentYear}`;
  document.getElementById('trackerTitle').textContent = `${MONTHS[currentMonth]} ${currentYear}`;
  document.getElementById('todayBadge').innerHTML = isCurrentMonth ? `<span class="today-badge">Today: ${today.toLocaleDateString('en', {weekday:'short'})}, ${todayD}</span>` : '';

  // Build weeks
  const weeks = [];
  let week = { start: 1, end: 0 };
  for (let d = 1; d <= daysInMonth; d++) {
    const dow = new Date(currentYear, currentMonth, d).getDay();
    if (d === 1) week.start = d;
    if (dow === 6 || d === daysInMonth) { week.end = d; weeks.push({...week}); week = {start: d+1, end: 0}; }
  }

  let html = '<thead>';
  // Week headers
  html += '<tr><th class="habit-col">Habits</th>';
  weeks.forEach((w, wi) => {
    const span = w.end - w.start + 1;
    html += `<th colspan="${span}" class="week-group">Week ${wi + 1}</th>`;
  });
  html += '</tr>';
  // Day number headers
  html += '<tr><th class="habit-col"></th>';
  for (let d = 1; d <= daysInMonth; d++) {
    const dow = new Date(currentYear, currentMonth, d).getDay();
    const dayName = DAYS[dow];
    const isToday = isCurrentMonth && d === todayD;
    html += `<th class="day-num ${isToday ? 'today-col' : ''}">${d}<br><span style="font-weight:400;opacity:.7">${dayName}</span></th>`;
  }
  html += '</tr></thead><tbody>';

  // Habit rows
  habits.forEach(habit => {
    html += `<tr><td class="habit-name"><span class="habit-emoji">${habit.emoji}</span>${habit.name}</td>`;
    for (let d = 1; d <= daysInMonth; d++) {
      const isFuture = currentYear === todayY && currentMonth === todayM && d > todayD;
      const checked = isChecked(habit.id, currentYear, currentMonth, d);
      const isToday = isCurrentMonth && d === todayD;
      html += `<td class="check-cell${isToday ? ' today-col' : ''}">
        <div class="cb ${checked ? 'checked' : ''} ${isFuture ? 'future' : ''}" 
             onclick="handleCheck('${habit.id}',${currentYear},${currentMonth},${d},this)"
             role="checkbox" aria-checked="${checked}" tabindex="${isFuture ? -1 : 0}"
             aria-label="${habit.name} day ${d}">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
      </td>`;
    }
    html += '</tr>';
  });

  // Empty state
  if (habits.length === 0) {
    html += `<tr><td colspan="${daysInMonth + 1}">
      <div class="empty-state">
        <div class="empty-state-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg></div>
        <h3>No habits yet</h3>
        <p>Add your first habit to start tracking your progress.</p>
        <button class="btn btn-primary" onclick="showPage('habits')">Add your first habit</button>
      </div>
    </td></tr>`;
  }

  // Progress row
  html += '<tr class="progress-row"><td class="habit-name">Progress %</td>';
  for (let d = 1; d <= daysInMonth; d++) {
    const isFuture = currentYear === todayY && currentMonth === todayM && d > todayD;
    if (isFuture || habits.length === 0) { html += '<td>—</td>'; continue; }
    let done = 0;
    habits.forEach(h => { if (isChecked(h.id, currentYear, currentMonth, d)) done++; });
    const pct = Math.round(done / habits.length * 100);
    const cls = pct >= 80 ? 'pct-high' : pct >= 50 ? 'pct-mid' : 'pct-low';
    html += `<td><span class="progress-pct ${cls}">${pct}%</span></td>`;
  }
  html += '</tr>';

  // Count row
  html += '<tr class="count-row"><td class="habit-name">Done</td>';
  for (let d = 1; d <= daysInMonth; d++) {
    const isFuture = currentYear === todayY && currentMonth === todayM && d > todayD;
    if (isFuture || habits.length === 0) { html += '<td>—</td>'; continue; }
    let done = 0;
    habits.forEach(h => { if (isChecked(h.id, currentYear, currentMonth, d)) done++; });
    html += `<td>${done}</td>`;
  }
  html += '</tr></tbody>';

  document.getElementById('trackerTable').innerHTML = html;
  renderStats();
  renderChart();
}

// ============ HANDLE CHECK ============
function handleCheck(habitId, year, month, day, el) {
  const nowChecked = toggleCheck(habitId, year, month, day);
  el.classList.toggle('checked', nowChecked);
  el.setAttribute('aria-checked', nowChecked);

  // Animate
  el.style.transform = 'scale(0.85)';
  setTimeout(() => { el.style.transform = 'scale(1)'; }, 120);

  renderStats();
  renderChart();
  updateProgressRows(year, month);

  // Celebrate 100%
  const ts = getTodayStats();
  if (nowChecked && ts.done === appData.habits.length && ts.pct === 100) {
    confetti();
    showToast('🎉 100% today! Incredible!', 'success');
  }
  saveData();
}

function updateProgressRows(year, month) {
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const habits = appData.habits;
  const todayD = today.getDate(), todayM = today.getMonth(), todayY = today.getFullYear();

  const progressCells = document.querySelectorAll('.progress-row td:not(.habit-name)');
  const countCells = document.querySelectorAll('.count-row td:not(.habit-name)');
  for (let d = 1; d <= daysInMonth; d++) {
    const isFuture = year === todayY && month === todayM && d > todayD;
    if (isFuture || habits.length === 0) continue;
    let done = 0;
    habits.forEach(h => { if (isChecked(h.id, year, month, d)) done++; });
    const pct = Math.round(done / habits.length * 100);
    const cls = pct >= 80 ? 'pct-high' : pct >= 50 ? 'pct-mid' : 'pct-low';
    if (progressCells[d - 1]) progressCells[d - 1].innerHTML = `<span class="progress-pct ${cls}">${pct}%</span>`;
    if (countCells[d - 1]) countCells[d - 1].textContent = done;
  }
}

// ============ HABITS PAGE ============
function renderHabitsPage() {
  const habits = appData.habits;
  document.getElementById('habitCountBadge').textContent = `${habits.length} habit${habits.length !== 1 ? 's' : ''}`;

    document.getElementById('habitListBody').innerHTML = `
      <div class="empty-state" style="padding:var(--space-10) var(--space-4)">
        <div class="empty-state-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg></div>
        <h3>No habits yet</h3>
        <p>Add your first habit using the form.</p>
      </div>`;
    return;
  }

  let html = '';
  habits.forEach((h, i) => {
    const streak = getCurrentStreak(h.id);
    html += `
      <div class="habit-list-item" draggable="true" data-idx="${i}">
        <div class="drag-handle">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="5" r="1" fill="currentColor"/><circle cx="9" cy="12" r="1" fill="currentColor"/><circle cx="9" cy="19" r="1" fill="currentColor"/><circle cx="15" cy="5" r="1" fill="currentColor"/><circle cx="15" cy="12" r="1" fill="currentColor"/><circle cx="15" cy="19" r="1" fill="currentColor"/></svg>
        </div>
        <div class="habit-info">
          <div class="habit-emoji-big">${h.emoji}</div>
          <div>
            <div class="habit-name-text">${h.name}</div>
            ${streak > 0 ? `<div class="habit-streak">🔥 ${streak} day streak</div>` : '<div class="habit-streak">No streak yet</div>'}
          </div>
        </div>
        <div class="habit-actions">
          <button class="icon-btn" onclick="editHabit(${i})" aria-label="Edit habit">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          </button>
          <button class="icon-btn danger" onclick="deleteHabit(${i})" aria-label="Delete habit">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg>
          </button>
        </div>
      </div>`;
  });
  document.getElementById('habitListBody').innerHTML = html;
  renderEmojiPicker('emojiPicker', 'page');
}

function renderEmojiPicker(containerId, mode) {
  const container = document.getElementById(containerId);
  if (!container) return;
  let html = '';
  EMOJIS.forEach(e => {
    const sel = (mode === 'page' ? selectedEmoji : modalSelectedEmoji) === e ? 'selected' : '';
    html += `<button class="emoji-btn ${sel}" onclick="selectEmoji('${e}','${mode}','${containerId}')" aria-label="${e}">${e}</button>`;
  });
  container.innerHTML = html;
}

function selectEmoji(emoji, mode, containerId) {
  if (mode === 'page') selectedEmoji = emoji;
  else modalSelectedEmoji = emoji;
  renderEmojiPicker(containerId, mode);
}

function addHabit() {
  const name = document.getElementById('habitNameInput').value.trim();
  if (!name) { showToast('Please enter a habit name', 'warn'); return; }
  appData.habits.push({ id: 'h' + appData.nextId++, name, emoji: selectedEmoji });
  document.getElementById('habitNameInput').value = '';
  saveData();
  renderHabitsPage();
  showToast(`✅ "${name}" added!`, 'success');
}

function deleteHabit(idx) {
  const h = appData.habits[idx];
  appData.habits.splice(idx, 1);
  saveData();
  renderHabitsPage();
  showToast(`Deleted "${h.name}"`, 'info');
  if (document.querySelector('.page.active')?.id === 'page-tracker') renderTracker();
}

function editHabit(idx) {
  const h = appData.habits[idx];
  const name = prompt('Edit habit name:', h.name);
  if (name === null) return;
  if (!name.trim()) { showToast('Name cannot be empty', 'warn'); return; }
  appData.habits[idx].name = name.trim();
  saveData();
  renderHabitsPage();
  showToast('Habit updated', 'success');
}

// ============ CHECK IN TODAY ============
function checkToday() {
  const habits = appData.habits;
  if (!habits.length) { showPage('habits'); return; }
  const y = today.getFullYear(), m = today.getMonth(), d = today.getDate();
  let allChecked = habits.every(h => isChecked(h.id, y, m, d));
  if (allChecked) {
    showToast('All habits already checked for today! 🎉', 'success');
    return;
  }
  habits.forEach(h => { appData.checks[ck(h.id, y, m, d)] = true; });
  saveData();
  renderTracker();
  confetti();
  showToast('All habits checked for today! 🎉', 'success');
}

// ============ STREAKS ============
function renderStreaks() {
  const habits = appData.habits;
  if (!habits.length) {
    document.getElementById('streaksGrid').innerHTML = `
      <div style="grid-column:1/-1" class="empty-state">
        <div class="empty-state-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg></div>
        <h3>No habits yet</h3>
        <p>Add habits to start building streaks.</p>
        <button class="btn btn-primary" onclick="showPage('habits')">Add habits</button>
      </div>`;
    return;
  }
  let html = '';
  habits.forEach(h => {
    const streak = getCurrentStreak(h.id);
    const longest = getLongestStreak(h.id);
    // Last 28 days dots
    const dots = [];
    for (let i = 27; i >= 0; i--) {
      const d2 = new Date(today); d2.setDate(d2.getDate() - i);
      const chk = isChecked(h.id, d2.getFullYear(), d2.getMonth(), d2.getDate());
      const isT = i === 0;
      dots.push(`<div class="streak-dot ${chk ? (isT ? 'today' : 'on') : ''}" title="${d2.toDateString()}"></div>`);
    }
    html += `
      <div class="streak-card">
        <div class="streak-emoji">${h.emoji}</div>
        <div class="streak-habit-name">${h.name}</div>
        <div class="streak-count">${streak}🔥</div>
        <div class="streak-label">current streak</div>
        <div style="font-size:var(--text-xs);color:var(--color-text-muted);margin-top:var(--space-2)">Longest: ${longest} days</div>
        <div class="streak-dots">${dots.join('')}</div>
      </div>`;
  });
  document.getElementById('streaksGrid').innerHTML = html;
}

// ============ HEATMAP ============
function renderHeatmap() {
  const end = new Date(today);
  const start = new Date(today);
  start.setFullYear(start.getFullYear() - 1);

  let html = '';
  let d = new Date(start);
  while (d <= end) {
    const habits = appData.habits;
    let done = 0;
    habits.forEach(h => { if (isChecked(h.id, d.getFullYear(), d.getMonth(), d.getDate())) done++; });
    const pct = habits.length ? done / habits.length : 0;
    const level = pct === 0 ? 0 : pct < 0.3 ? 1 : pct < 0.6 ? 2 : pct < 1 ? 3 : 4;
    const dateStr = d.toLocaleDateString('en', {month:'short',day:'numeric',year:'numeric'});
    html += `<div class="hm-cell" data-pct="${level}" title="${dateStr}: ${Math.round(pct*100)}%"></div>`;
    d.setDate(d.getDate() + 1);
  }
  document.getElementById('heatmapGrid').innerHTML = html;
}

// ============ MODAL ============
function openAddHabitModal() {
  document.getElementById('addHabitModal').classList.add('open');
  renderEmojiPicker('modalEmojiPicker', 'modal');
  document.getElementById('modalHabitName').focus();
}
function closeModal() {
  document.getElementById('addHabitModal').classList.remove('open');
}
function addHabitFromModal() {
  const name = document.getElementById('modalHabitName').value.trim();
  if (!name) { showToast('Please enter a habit name', 'warn'); return; }
  appData.habits.push({ id: 'h' + appData.nextId++, name, emoji: modalSelectedEmoji });
  document.getElementById('modalHabitName').value = '';
  saveData();
  closeModal();
  renderTracker();
  showToast(`✅ "${name}" added!`, 'success');
}

// ============ THEME ============
function toggleTheme() {
  const html = document.documentElement;
  const isDark = html.getAttribute('data-theme') === 'dark';
  const newTheme = isDark ? 'light' : 'dark';
  html.setAttribute('data-theme', newTheme);
  const btn = document.querySelector('[data-theme-toggle]');
  btn.innerHTML = newTheme === 'dark'
    ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>'
    : '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>';
  setTimeout(() => renderChart(), 50);
}

// ============ TOAST ============
function showToast(msg, type = 'info') {
  const icons = { success: '✅', warn: '⚠️', info: 'ℹ️', error: '❌' };
  const container = document.getElementById('toastContainer');
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.innerHTML = `<span class="t-icon">${icons[type]}</span><span>${msg}</span>`;
  container.appendChild(toast);
  setTimeout(() => {
    toast.classList.add('out');
    setTimeout(() => toast.remove(), 200);
  }, 3000);
}

// ============ CONFETTI ============
function confetti() {
  const container = document.getElementById('confettiContainer');
  const colors = ['#4f98a3','#6daa45','#e8af34','#d163a7','#bb653b','#5591c7'];
  for (let i = 0; i < 60; i++) {
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    piece.style.cssText = `
      left: ${Math.random() * 100}%;
      top: -10px;
      background: ${colors[Math.floor(Math.random() * colors.length)]};
      animation-delay: ${Math.random() * 0.5}s;
      animation-duration: ${1 + Math.random() * 1}s;
      width: ${6 + Math.random() * 8}px;
      height: ${6 + Math.random() * 8}px;
      border-radius: ${Math.random() > 0.5 ? '50%' : '2px'};
    `;
    container.appendChild(piece);
    setTimeout(() => piece.remove(), 2500);
  }
}

// ============ EXPORT CSV ============
function exportCSV() {
  const stats = getMonthStats(currentYear, currentMonth);
  const habits = appData.habits;
  const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
  let csv = `HabitForge Export — ${MONTHS[currentMonth]} ${currentYear}
`;
  csv += 'Habit,' + Array.from({length: daysInMonth}, (_, i) => i + 1).join(',') + ',Total
';
  habits.forEach(h => {
    let row = `"${h.emoji} ${h.name}",`;
    let total = 0;
    for (let d = 1; d <= daysInMonth; d++) {
      const c = isChecked(h.id, currentYear, currentMonth, d) ? 1 : 0;
      total += c; row += c + ',';
    }
    csv += row + total + '
';
  });
  csv += '
Progress %,' + Array.from({length: daysInMonth}, (_, i) => {
    let done = 0; const d = i + 1;
    habits.forEach(h => { if (isChecked(h.id, currentYear, currentMonth, d)) done++; });
    return habits.length ? Math.round(done / habits.length * 100) + '%' : '0%';
  }).join(',') + '
';

  const blob = new Blob([csv], { type: 'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `habitforge-${MONTHS[currentMonth].toLowerCase()}-${currentYear}.csv`;
  a.click();
  showToast('CSV exported!', 'success');
}

// ============ KEYBOARD SHORTCUTS ============
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (e.key === 'Escape') closeModal();
  if (e.key === 't') showPage('tracker');
  if (e.key === 'h') showPage('habits');
  if (e.key === 's') showPage('streaks');
  if (e.key === 'm') showPage('heatmap');
});

// ============ CLOSE MODAL ON OVERLAY CLICK ============
document.getElementById('addHabitModal').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

// ============ INIT ============
renderEmojiPicker('emojiPicker', 'page');
renderTracker();
